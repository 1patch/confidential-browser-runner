# Public Pi worker measurement. Verify this exact release before secret delivery.
cvm-version: "0.14.8"
cpus: 2
memory: 8192
networks:
  browser-net:
    egress: open
containers:
  - name: browser
    image: "ghcr.io/1patch/confidential-browser-runner@sha256:2248673250eeffc0bbf81452a43f86d01102114bf7ab813512479133ee68ef57"
    # Root exists only in this measured startup shim, which execs setpriv and
    # clears every capability before the worker can accept any runtime secret.
    cvm_admin: true
    entrypoint: ["/usr/local/bin/browser-cvm-entrypoint"]
    # An inline map is measured. A bare environment-variable name is not.
    env:
      - BROWSER_BOOTSTRAP_PUBLIC_KEY: "IJRJssmBt+2xWp6xPYERpCG2281VyHTJYZXtxOTuR5c="
    networks: [browser-net]
    read_only: true
    memory: 2GiB
    shm_size: 256MiB
    pids_limit: 256
    tmpfs:
      /tmp: "rw,nosuid,nodev,noexec,size=512m,mode=1777"
      /workspace: "rw,nosuid,nodev,noexec,size=512m,uid=10001,gid=10001,mode=0700"
    restart: "no"
    # HTTP drain (35s), encrypted checkpoint (90s), plus shutdown margin.
    stop_timeout: 150
shim:
  upstream-container: browser
  upstream-port: 8080
  paths: ["/healthz", "/v1/bootstrap", "/v1/drain", "/v1/storage", "/v1/exec", "/v1/credentials", "/v1/agent"]
  # Use the certificate proxy's standard attestation SAN domain.
  tls-own-san-domain: false
  tls-wildcard: false
  publish-attestation: true
  dummy-attestation: false
